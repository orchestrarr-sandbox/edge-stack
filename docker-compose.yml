services:
  web:
    image: nginx:1.28
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
  app:
    image: hashicorp/http-echo:latest
    command: ["-text=hello from the edge stack", "-listen=:5678"]
    privileged: true
  cache:
    image: redis:8.0
    ports:
      - "6379:6379"
